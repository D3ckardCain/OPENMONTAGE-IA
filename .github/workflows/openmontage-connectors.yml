name: OPENMONTAGE connector contracts
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest tests/tools/test_official_uefa_live.py tests/tools/test_youtube_research.py tests/tools/test_youtube_client.py tests/contracts/test_cultural_audio.py tests/contracts/test_local_budget_policy.py tests/tools/test_youtube_channels.py tests/backlot/test_channel_search.py -q

  browser-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt playwright
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m playwright install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/openmontage-test-browsers
      - name: Browser tests with external networking disabled
        run: |
          PYTHON_BIN="$(python -c 'import sys; print(sys.executable)')"
          sudo --preserve-env=PLAYWRIGHT_BROWSERS_PATH unshare --net -- bash -c 'ip link set lo up; exec "$@"' bash "$PYTHON_BIN" -m pytest tests/backlot/test_ui_bug_bash.py tests/backlot/test_channel_browser.py -q
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/openmontage-test-browsers
