name: OPENMONTAGE connector contracts
on:
  push:
    branches: [feat/local-agent-research-foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest tests/tools/test_official_uefa_live.py tests/tools/test_official_fifa_live.py tests/tools/test_fifa_player_resolution.py tests/tools/test_sports_sources.py tests/tools/test_football_research.py tests/tools/test_youtube_research.py tests/tools/test_youtube_client.py tests/contracts/test_cultural_audio.py tests/contracts/test_local_budget_policy.py tests/tools/test_youtube_channels.py tests/tools/test_channel_identity.py tests/tools/test_youtube_errors.py tests/tools/test_youtube_channel_batch.py tests/backlot/test_channel_search.py tests/backlot/test_production_studio.py tests/backlot/test_studio_multilingual_flow.py tests/tools/test_model_adapters.py tests/tools/test_model_validation.py tests/tools/test_wan_presets.py -q
      - name: Workflow preparation and application center contracts
        run: python -m pytest tests/tools/test_workflow_preparation.py tests/tools/test_integration_preparation.py tests/tools/test_blender_binding.py tests/tools/test_media_bindings.py tests/tools/test_setup_center.py tests/tools/test_render_verification.py tests/tools/test_final_delivery.py tests/tools/test_final_catalog.py tests/tools/test_delivery_recovery.py tests/tools/test_production_queue.py tests/tools/test_language_versions.py tests/tools/test_reference_language.py tests/tools/test_reference_reuse.py tests/tools/test_model_languages.py tests/tools/test_model_copies.py tests/tools/test_model_file_checks.py tests/tools/test_madlad.py tests/tools/test_translation_segments.py tests/tools/test_translation_progress.py tests/tools/test_project_translation.py tests/tools/test_resource_inventory.py tests/tools/test_download_plan.py -q
      - name: Local reference analysis and WAN recovery contracts
        run: python -m pytest tests/tools/test_reference_analysis.py tests/tools/test_producer_reference_action.py tests/tools/test_comfy_job_records.py tests/tools/test_i2v_image_transfer.py tests/tools/test_agent_source_image.py tests/tools/test_production_input_image.py tests/tools/test_comfy_history_report.py tests/tools/test_comfy_history_routes.py -q

  browser-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt playwright
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m playwright install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/openmontage-test-browsers
      - name: Browser tests with external networking disabled
        run: |
          PYTHON_BIN="$(python -c 'import sys; print(sys.executable)')"
          sudo --preserve-env=PLAYWRIGHT_BROWSERS_PATH unshare --net -- bash -c 'ip link set lo up; exec "$@"' bash "$PYTHON_BIN" -m pytest tests/backlot/test_ui_bug_bash.py tests/backlot/test_channel_browser.py tests/backlot/test_studio_browser.py -q
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/openmontage-test-browsers
